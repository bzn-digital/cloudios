# Cloudios — Local Development (Docker Compose)
#
# Usage:
#   docker compose up --build
#
# Services:
#   webapi: API REST on http://localhost:5021
#   webapp: React client panel on http://localhost:80
#   webplatform: React admin panel on http://localhost:8080
# SQLite databases persist in named volumes.

services:
  webapi:
    build:
      context: .
      dockerfile: src/Bzn.Cloudios.WebAPI/Dockerfile
    container_name: cloudios-webapi
    ports:
      - "5022:5021"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5021
      - ConnectionStrings:MainDb=Data Source=/app/data/cloudios_main.db;Mode=ReadWriteCreate;Cache=Shared
      - ConnectionStrings:MetricsDb=Data Source=/app/data/cloudios_metrics.db;Mode=ReadWriteCreate;Cache=Shared
    volumes:
      - cloudios-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cloudios-network
    restart: unless-stopped

  webapp:
    build:
      context: ./src/Bzn.Cloudios.WebApp
      dockerfile: Dockerfile
    container_name: cloudios-webapp
    ports:
      - "80:80"
    depends_on:
      - webapi
    networks:
      - cloudios-network
    restart: unless-stopped

  webplatform:
    build:
      context: ./src/Bzn.Cloudios.WebPlatform
      dockerfile: Dockerfile
    container_name: cloudios-webplatform
    ports:
      - "8080:80"
    depends_on:
      - webapi
    networks:
      - cloudios-network
    restart: unless-stopped

volumes:
  cloudios-data:

networks:
  cloudios-network:
    driver: bridge
