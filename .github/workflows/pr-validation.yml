name: PR Validation

on:
  pull_request:
    branches:
      - main
      - development

jobs:
  build-and-publish:
    name: Build & AOT Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: AOT Publish (linux-x64)
        run: dotnet publish --no-build --configuration Release --runtime linux-x64
